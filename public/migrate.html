<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migration DB - Ink Creative</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 90%;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 24px;
    }
    p {
      color: #666;
      margin: 0 0 30px 0;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .result.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .result.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Migration Base de Données</h1>
    <p>Créer la table "clicks" dans la base de données Vercel</p>
    
    <button id="migrateBtn" onclick="runMigration()">
      Lancer la migration
    </button>
    
    <div id="result" class="result"></div>
  </div>

  <script>
    async function runMigration() {
      const btn = document.getElementById('migrateBtn');
      const result = document.getElementById('result');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Migration en cours...';
      result.style.display = 'none';
      
      try {
        const response = await fetch('https://ink-creative.fr/api/admin/db-migrate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ password: 'marSoso04' })
        });
        
        const data = await response.json();
        
        result.style.display = 'block';
        
        if (response.ok) {
          result.className = 'result success';
          result.innerHTML = `
            <strong>✅ Migration réussie !</strong><br>
            ${data.message}
            ${data.stdout ? '<pre>' + data.stdout + '</pre>' : ''}
          `;
        } else {
          result.className = 'result error';
          result.innerHTML = `
            <strong>❌ Erreur</strong><br>
            ${data.error}<br>
            ${data.details ? '<pre>' + data.details + '</pre>' : ''}
            ${data.stderr ? '<pre>' + data.stderr + '</pre>' : ''}
          `;
        }
      } catch (error) {
        result.style.display = 'block';
        result.className = 'result error';
        result.innerHTML = `<strong>❌ Erreur réseau</strong><br>${error.message}`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Lancer la migration';
      }
    }
  </script>
</body>
</html>
